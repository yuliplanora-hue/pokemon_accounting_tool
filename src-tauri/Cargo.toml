[package]
name = "pokemon-toiminimi-accounting"
version = "0.2.0"
description = "Local-first accounting workspace for a Finnish private trader"
authors = ["Pokemon Toiminimi"]
edition = "2021"

[lib]
name = "pokemon_toiminimi_accounting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
lopdf = "0.35"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
